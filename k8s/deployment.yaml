# tells kubernetes how to run it

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: oge1ata/demo-app:56ac930026cbaf5d9f6efa5dfb52c1c0074b0653
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels:
    app: demo-app        # added
spec:
  selector:
    app: demo-app
  ports:
  - name: http           # added
    port: 80
    targetPort: 8000


