# tells kubernetes how to run it

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: oge1ata/demo-app:e2f046c2c78f96c99a1d14ed10eb2f29c858c6cb
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels:
    app: demo-app        # added
spec:
  selector:
    app: demo-app
  ports:
  - name: http           # added
    port: 80
    targetPort: 8000


